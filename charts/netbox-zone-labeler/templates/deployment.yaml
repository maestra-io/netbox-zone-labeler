apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netbox-zone-labeler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbox-zone-labeler.labels" . | nindent 4 }}
spec:
  # Single instance by design: there is no leader election, and two labelers
  # would race each other on the same node patches. Recreate keeps the old pod
  # from overlapping the new one for the same reason.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "netbox-zone-labeler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netbox-zone-labeler.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the tbot config changes; a ConfigMap edit alone
        # restarts nothing.
        checksum/tbot-config: {{ include (print $.Template.BasePath "/tbot-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Native sidecar: started before the labeler, must pass its startup
        # probe before the labeler starts, and is stopped after it. The
        # labeler therefore never sees a tunnel that is not up yet, and an
        # in-flight NetBox request is not cut by the tunnel going away first.
        - name: tbot
          restartPolicy: Always
          image: {{ .Values.tbot.image }}
          args:
            - start
            - -c
            - /config/tbot.yaml
          ports:
            - containerPort: {{ .Values.tbot.diagPort }}
              name: tbot-diag
          securityContext:
            {{- include "netbox-zone-labeler.containerSecurityContext" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: tbot-diag
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: tbot-diag
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: tbot-diag
            periodSeconds: 10
          volumeMounts:
            - name: tbot-config
              mountPath: /config
              readOnly: true
            - name: teleport-join-token
              mountPath: /var/run/secrets/teleport-join
              readOnly: true
          env:
            - name: KUBERNETES_TOKEN_PATH
              value: /var/run/secrets/teleport-join/token
          resources:
            {{- toYaml .Values.tbot.resources | nindent 12 }}
      containers:
        - name: labeler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: health
          securityContext:
            {{- include "netbox-zone-labeler.containerSecurityContext" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          env:
            - name: NETBOX_URL
              value: {{ .Values.netbox.url | quote }}
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netbox-zone-labeler
                  key: token
            {{- if .Values.excludeNodeRoles }}
            - name: EXCLUDE_NODE_ROLES
              value: {{ .Values.excludeNodeRoles | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tbot-config
          configMap:
            name: {{ include "netbox-zone-labeler.fullname" . }}-tbot
        - name: teleport-join-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
                  audience: teleport.maestra.io
