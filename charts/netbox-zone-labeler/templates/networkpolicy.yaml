apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-zone-labeler
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netbox-zone-labeler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus scrape on metrics port
    - ports:
        - port: 8081
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Kubernetes API server
    - ports:
        - port: 6443
          protocol: TCP
    # Allow Teleport proxy (tbot sidecar: 443 for API, 3024 for auth tunnel)
    - ports:
        - port: 443
          protocol: TCP
        - port: 3024
          protocol: TCP
