image:
  repository: 515260921971.dkr.ecr.eu-central-1.amazonaws.com/netbox-zone-labeler
  tag: ""
  pullPolicy: IfNotPresent

tbot:
  image: public.ecr.aws/gravitational/tbot-distroless:18.11.0
  proxyServer: teleport.maestra.io:443
  appName: netbox
  port: 8080
  joinToken: netbox-zone-labeler
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

netbox:
  url: "http://localhost:8080"

# Comma-separated list of node roles to exclude from labeling.
# Nodes with label node-role.kubernetes.io/<role> will be skipped.
# Example: "master,control-plane,system"
excludeNodeRoles: ""

env: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

priorityClassName: ""

nodeSelector:
  node-role.kubernetes.io/system: ""

tolerations:
  - key: node-role.kubernetes.io/system
    operator: Exists
    effect: NoSchedule

serviceAccount:
  name: netbox-zone-labeler
