version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
