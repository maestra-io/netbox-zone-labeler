name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 515260921971.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Ensure ECR repositories exist
        run: |
          for REPO in netbox-zone-labeler helm-charts/netbox-zone-labeler; do
            aws ecr describe-repositories --repository-names "$REPO" 2>/dev/null || \
              aws ecr create-repository --repository-name "$REPO"
          done

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.ECR_REGISTRY }}/netbox-zone-labeler
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Package and push Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/netbox-zone-labeler/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/netbox-zone-labeler/Chart.yaml
          helm package charts/netbox-zone-labeler
          helm push netbox-zone-labeler-${VERSION}.tgz oci://${{ env.ECR_REGISTRY }}/helm-charts
