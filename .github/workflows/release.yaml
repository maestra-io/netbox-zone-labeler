name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-netbox-zone-labeler
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"

jobs:
  # A tag is not necessarily on main: run the same gates CI runs before
  # anything is pushed to the registry.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: helm lint --strict charts/netbox-zone-labeler

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      # helm and the AWS CLI v2 are preinstalled on ubuntu-latest.
      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOT

          mkdir -p /tmp/tbot-output
          # The SVID file is the real success signal; a non-zero exit is
          # surfaced as a warning instead of being swallowed.
          if ! tbot start -c /tmp/tbot.yaml; then
            echo "::warning::tbot exited non-zero; continuing only if the SVID was written"
          fi
          test -f /tmp/tbot-output/jwt_svid

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          # Ensure ECR repositories exist
          for REPO in netbox-zone-labeler helm-charts/netbox-zone-labeler; do
            aws ecr describe-repositories --repository-names "$REPO" 2>/dev/null || \
              aws ecr create-repository --repository-name "$REPO"
          done

          # Login Docker + Helm to ECR
          PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "$PASSWORD" | docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin
          echo "$PASSWORD" | helm registry login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

      # Bare tag list that docker/metadata-action produces below, derived the same
      # way the Helm chart step derives its version. metadata-action itself only
      # emits full references, which the mirror step cannot consume.
      - name: Derive pushed tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tags=${VERSION},${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.ECR_REGISTRY }}/netbox-zone-labeler
          # No floating `latest`: the chart pins appVersion, and `latest` was
          # the one tag the us-west-2 mirror step below never received.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Was the phase 3 dual-push mirror of the ECR eu-central-1 -> us-west-2
      # migration; phase 6 froze eu-central-1 and this workflow now pushes
      # straight to us-west-2, so the mirror has nothing to copy and is off
      # (https://github.com/maestra-io/issues-maestra/issues/1354, rake #8).
      # This workflow pushes with its own docker/build-push-action, so it bypasses
      # the dual-push already built into the shared composite actions.
      - name: Mirror image to the secondary ECR region (off since phase 6)
        uses: maestra-io/github-actions/mirror-to-secondary-ecr@main
        with:
          # Phase 6 (issues-maestra#1354): eu-central-1 is frozen, us-west-2 is the
          # only push target, so there is nothing left to mirror. Empty skips the
          # whole step. Kept as a call so restoring a mirror is one value.
          secondaryRegion: ''
          repository: netbox-zone-labeler
          tag: ${{ steps.tags.outputs.image_tags }}
          registry: ${{ env.ECR_REGISTRY }}
          awsRoleArn: ${{ env.AWS_ROLE_ARN }}
          awsWebIdentityTokenFile: /tmp/tbot-output/jwt_svid

      - name: Package and push Helm chart
        run: |
          VERSION="${{ steps.tags.outputs.version }}"
          helm package charts/netbox-zone-labeler --version "${VERSION}" --app-version "${VERSION}"
          helm push "netbox-zone-labeler-${VERSION}.tgz" oci://${{ env.ECR_REGISTRY }}/helm-charts

      # Same mirroring for the Helm chart artifact, which is pushed with its own
      # `helm push` to the `helm-charts/netbox-zone-labeler` ECR repository.
      - name: Mirror Helm chart to the secondary ECR region (off since phase 6)
        uses: maestra-io/github-actions/mirror-to-secondary-ecr@main
        with:
          # Phase 6 (issues-maestra#1354): eu-central-1 is frozen, us-west-2 is the
          # only push target, so there is nothing left to mirror. Empty skips the
          # whole step. Kept as a call so restoring a mirror is one value.
          secondaryRegion: ''
          repository: helm-charts/netbox-zone-labeler
          tag: ${{ steps.tags.outputs.version }}
          registry: ${{ env.ECR_REGISTRY }}
          awsRoleArn: ${{ env.AWS_ROLE_ARN }}
          awsWebIdentityTokenFile: /tmp/tbot-output/jwt_svid
